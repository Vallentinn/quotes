name: Ребалансировка портфеля

on:
  schedule:
    # 1-го числа каждого месяца в 06:00 UTC — данные за последний день
    # предыдущего месяца уже скачаны ночным обновлением
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write             # чтобы создать задачу с отчётом

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить пакеты
        run: pip install pandas numpy

      - name: Посчитать веса
        run: |
          {
            echo '```'
            python tsmom.py
            echo '```'
          } > report.md

      - name: Создать задачу с отчётом
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Ребалансировка $(date -u +%Y-%m-%d)" \
            --assignee Vallentinn \
            --body-file report.md
