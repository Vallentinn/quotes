name: Сигнал SineTrend

# Ежедневная проверка собственной стратегии. Задача создаётся только тогда,
# когда на следующую сессию есть заявки.

on:
  schedule:
    - cron: "45 5 * * 2-6"     # вт–сб 05:45 UTC: после обновления котировок за прошлую сессию США
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Забрать котировки из публичного репозитория
        run: |
          git clone --depth 1 https://github.com/Vallentinn/quotes.git public
          cp -r public/quotes ./quotes

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить пакеты
        run: pip install pandas numpy

      - name: Посчитать сигнал
        run: |
          {
            echo '```'
            python sinetrend_signal.py
            echo '```'
          } > signal.md
          cat signal.md

      - name: Создать задачу, если есть заявки
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "БЕЗ ДЕЙСТВИЙ" signal.md; then
            echo "Заявок нет — задача не создаётся"
          else
            gh issue create \
              --title "SineTrend: заявка на $(date -u +%Y-%m-%d)" \
              --assignee ${{ github.repository_owner }} \
              --body-file signal.md
          fi
