name: Обновление котировок

on:
  schedule:
    - cron: "17 0 * * *"     # каждый день 00:17 UTC (02:17 по Берлину летом, 01:17 зимой)
  workflow_dispatch:

permissions:
  contents: write
  issues: write          # нужно, чтобы создавать Issue с отчётом проверки

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить пакеты
        run: pip install pandas yfinance

      - name: Скачать котировки
        run: python download_quotes.py

      - name: Проверить качество котировок
        id: check
        run: python check_quotes.py
        continue-on-error: true   # при проблемах не останавливаемся: данные коммитим, а сигналим через Issue

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add quotes/
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Котировки на $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Уведомить приватный репозиторий
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          gh api repos/Vallentinn/portfolio/dispatches \
            --field event_type=quotes-updated
        continue-on-error: true   # если токена нет — просто пропускаем

      - name: Сообщить о проблемах в данных
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-check --color D93F0B --description "Проверка котировок" --force
          # если открытый Issue уже есть — дописываем комментарий, а не плодим новые
          num=$(gh issue list --label data-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file check_report.md
          else
            gh issue create --title "Проверка котировок: $(date -u +%Y-%m-%d)" \
              --label data-check --body-file check_report.md
          fi
